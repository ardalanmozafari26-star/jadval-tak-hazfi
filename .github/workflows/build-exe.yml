name: Build EXE

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'electron-main.js'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build portable EXE
        run: npx electron-builder --win portable

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: jadval-tak-hazfi-exe
          path: dist/*.exe
