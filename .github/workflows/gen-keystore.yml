name: Gen Keystore

# یک‌بار اجرا برای ساخت کلید امضای نسخه نهایی (مایکت)
on:
  workflow_dispatch:
    inputs:
      storepass:
        description: 'رمز keystore'
        required: true
      alias:
        description: 'نام مستعار کلید'
        required: true
        default: 'jadval'

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair -keystore release.keystore \
            -alias "${{ inputs.alias }}" -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "${{ inputs.storepass }}" -keypass "${{ inputs.storepass }}" \
            -dname "CN=Jadval Takhazfi, OU=App, O=Jadval, L=Tehran, ST=Tehran, C=IR"
          keytool -list -v -keystore release.keystore -storepass "${{ inputs.storepass }}" | head -20

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
